# CI: runs on every push / PR to main. Must stay green before a deploy.
# Same checks as `npm run check` + `npm test` locally.
name: Sanity Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
      # v5 of both actions run on Node 24 (v3/v4 targeted the deprecated Node 20).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # Pin the Node version the project is developed and tested on, and
      # cache npm downloads between runs.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # `npm ci` installs exactly what package-lock.json says (no drift).
      - run: npm ci

      # Formatting (oxfmt), lint (oxlint), type check (tsc).
      - run: npm run check

      # Unit tests: seed, readiness engine, chat tool queries.
      - run: npm test
